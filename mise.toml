[tools]
bun = "1.4.0"
"github:gastownhall/beads" = "1.2.2"

[settings]
locked = true
http_retries = 15

# Code Quality & Build Tasks
# Quality gate tasks with structured dependencies for local developers and agents.
# `build` produces package dist/ output required by lint, typecheck, and test.

[tasks.build]
run = "bun run build"
description = "Build all packages"

[tasks.lint]
depends = ["build"]
run = "bun run lint"
description = "Lint the codebase"

[tasks.typecheck]
depends = ["lint"]
run = "bun run typecheck"
description = "Type check the codebase"

[tasks.test]
depends = ["typecheck"]
run = "bun test"
description = "Run all unit and integration tests"

[tasks.check-unused]
run = "bun run check:unused"
description = "Check for unused files, exports, and dependencies with Knip"

# OpenSpec Tools

[tasks.spec-list]
run = "bunx openspec list"
description = "List OpenSpec changes (openspec stays bunx; no mise shim configured)"

[tasks.spec-validate]
depends = ["test"]
run = "bunx openspec validate --all --strict"
description = "Validate OpenSpec changes strictly (openspec stays bunx; no mise shim configured)"

[tasks.check]
depends = ["spec-validate"]
description = "Run quality gates in CI order (build -> lint -> typecheck -> test -> spec-validate)"

# Beads Issue Tracker Integration

[tasks.bd-push]
run = "bd dolt push"
description = "Push the beads Dolt database to its remote"

[tasks.bd-sync]
run = "git pull --rebase && bd dolt push && git push && git status"
description = "Session-completion sync: rebase, push beads, push git, show status"

[tasks.bd-check]
run = "bd ready && bd lint"
description = "Show unblocked work and validate the beads database (bd doctor is broken in this repo's direct-mode DB)"
