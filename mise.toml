[tools]
bun = "1.3.14"
"github:gastownhall/beads" = "1.2.2"  # test-trigger-noop

[settings]
locked = true
http_retries = 15

[tasks.check-unused]
run = "bun run check:unused"
description = "Check for unused files, exports, and dependencies with Knip"

# Thin wrappers over existing commands so common flows run via one pre-approved
# `mise run <task>` entrypoint instead of prompting per command (canopy-eco).
# Not a build system: single commands or simple && chains only, no deps/conditionals.

[tasks.test]
run = "bun test"
description = "Run all tests"

[tasks.build]
run = "bun run build"
description = "Build all packages"

[tasks.lint]
run = "bun run lint"
description = "Lint the codebase"

[tasks.typecheck]
run = "bun run typecheck"
description = "Type check"

[tasks.check]
run = "bun run build && bun run lint && bun run typecheck && bun test"
description = "Run quality gates in CI order (build -> lint -> typecheck -> test)"

[tasks.bd-push]
run = "bd dolt push"
description = "Push the beads Dolt database to its remote"

[tasks.bd-sync]
run = "git pull --rebase && bd dolt push && git push && git status"
description = "Session-completion sync: rebase, push beads, push git, show status"

[tasks.bd-check]
run = "bd ready && bd lint"
description = "Show unblocked work and validate the beads database (bd doctor is broken in this repo's direct-mode DB)"

[tasks.spec-list]
run = "bunx openspec list"
description = "List OpenSpec changes (openspec stays bunx; no mise shim configured)"

[tasks.spec-validate]
run = "bunx openspec validate --strict"
description = "Validate OpenSpec changes strictly (openspec stays bunx; no mise shim configured)"

