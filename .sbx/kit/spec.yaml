schemaVersion: "2"
kind: mixin
name: canopy-toolchain
version: "0.1.0"
description: Bootstrap mise, bun, and beads toolchain for canopy

permissions:
  network:
    allow:
      - mise.run
      - mise.jdx.dev
      - github.com
      - api.github.com
      - "*.githubusercontent.com"
      - registry.npmjs.org
      - bun.sh

environment:
  variables:
    PATH: /home/agent/.local/share/mise/shims:/home/agent/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    MISE_YES: "1"

setup:
  install:
    - command: |
        curl -fsSL https://mise.run | MISE_VERSION=v2026.8.14 MISE_INSTALL_PATH=/usr/local/bin/mise sh
        echo 'if command -v mise >/dev/null 2>&1; then eval "$(mise activate bash)"; fi' > /etc/profile.d/mise.sh
      description: "Install mise into /usr/local/bin and configure profile"
    - command: "mise settings set paranoid false && mise settings set yes true && mise use -g bun@1.4.2 && mise use -g github:gastownhall/beads@1.2.2"
      user: "1000"
      description: "Install bun 1.4.2 and beads 1.2.2 for agent"
