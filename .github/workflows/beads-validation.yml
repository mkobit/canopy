name: Beads validation

on:
  schedule:
    - cron: '0 12 * * 3' # Every Wednesday at 12:00 UTC
  workflow_dispatch: {}

concurrency:
  group: beads-validation
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: v2026.5.1
          cache: 'true'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run beads convention audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/audit-beads-conventions.ts --report
