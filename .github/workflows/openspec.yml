name: OpenSpec

on:
  push:
    branches: ['main']
    paths:
      - 'openspec/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/openspec.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'openspec/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/openspec.yml'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        with:
          version: v2026.5.1
          cache: 'true'
      - name: Install dependencies
        run: bun install
      - name: Validate OpenSpec specs and changes
        # `bun exec openspec` resolves to the broken mise PATH shim
        # (`mise use -g npm:@fission-ai/openspec`, which errors); `bunx` runs the
        # `@fission-ai/openspec` devDependency binary directly.
        run: bunx openspec validate --all
