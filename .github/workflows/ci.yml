name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/design/**'
      - 'docs/architecture/**'
      - 'docs/research/**'
      - 'openspec/**'
      - '**/AGENTS.md'
      - '.claude/**'
      - '.jules/**'
      - '.gemini/**'
  pull_request:
    paths-ignore:
      - 'docs/design/**'
      - 'docs/architecture/**'
      - 'docs/research/**'
      - 'openspec/**'
      - '**/AGENTS.md'
      - '.claude/**'
      - '.jules/**'
      - '.gemini/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        bun-version: [1.3.14]

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          version: v2026.5.1
          cache: 'true'

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # Build first: prefer-immutable-types resolves cross-package
      # types via each package's published dist/index.d.ts.
      - name: Build
        if: "!cancelled() && steps.install.outcome == 'success'"
        run: bun run build

      - name: Lint
        if: "!cancelled() && steps.install.outcome == 'success'"
        # `bun run lint` runs eslint once per workspace (tools/lint-workspaces.ts)
        # instead of one root-level `eslint .`, bounding peak RSS to the single
        # largest workspace's type-aware program (~1.1GB) instead of the sum of
        # all of them (~3GB), which used to need an explicit NODE_OPTIONS bump
        # to avoid OOM-crashing on GitHub's macos-14 runners (canopy-9ec).
        run: bun run lint

      - name: Typecheck
        if: "!cancelled() && steps.install.outcome == 'success'"
        run: bun run typecheck

      - name: Test
        if: "!cancelled() && steps.install.outcome == 'success'"
        run: bun run test -- --coverage --coverage-reporter=lcov

      - name: Upload coverage
        if: "!cancelled() && steps.install.outcome == 'success'"
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
