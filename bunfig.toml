telemetry = false

# Disable automatic .env file loading
[run]
env = false

[install]
# minimumReleaseAge is in seconds (temporarily lowered to allow bun-types 1.4.3 released 2026-10-10)
minimumReleaseAge = 172800
ignoreScripts = true

[test]
preload = ["./apps/web/src/test/setup.ts"]
exclude = ["**/e2e/**"]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
